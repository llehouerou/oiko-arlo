name: Bug report
description: Something in the arlo type of Bridge does not work as it should. A bug in Oiko itself goes on Oiko's repository.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Output of `oiko -version`
      description: "The Build: Oiko's version and each type of Bridge compiled into it."
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Arlo camera model
      description: As Arlo's app shows it, with the base station's when there is one.
      placeholder: VMC4030P on a VMB4000
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Before you paste logs, configuration or a dump:** they can hold tokens, emails, host
        names, IP and MAC addresses, device serials and IDs, and people's names. Replace them with
        made-up ones; this issue is public.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
